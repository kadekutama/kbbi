[workspace]
authors = ["Kadek Dwi Budi Utama <kadekdwibudiutama@gmail.com>"]
channels = ["conda-forge"]
name = "kbbi"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
pycryptodome = ">=3.20"
openjdk = ">=17"

[feature.dev.dependencies]
pytest = ">=8"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
setup-apktool = "python scripts/setup_apktool.py"
unpack = "python scripts/unpack_xapk.py"
decode = "python scripts/decode_apk.py"
decrypt = "python scripts/decrypt_dict.py"
extract = "python scripts/extract_dict.py"
test = "python -m pytest -q"
key = "python scripts/kbbi_extract.py key"
info = "python scripts/kbbi_extract.py info"
