[workspace]
authors = ["Kadek Dwi Budi Utama <kadekdwibudiutama@gmail.com>"]
channels = ["conda-forge"]
name = "kbbi"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
kbbi-extract = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
decrypt = "python scripts/decrypt_dict.py"
extract = "python scripts/extract_dict.py"
test = "python -m pytest"
key = "python -m kbbi_extract key"
info = "python -m kbbi_extract info"
