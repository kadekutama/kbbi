[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kbbi-extract"
version = "0.1.0"
description = "Decrypt and parse the KBBI 6.x Android dictionary data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20",
]

[project.scripts]
kbbi-extract = "kbbi_extract.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kbbi_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
